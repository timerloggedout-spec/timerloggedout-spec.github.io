name: Pages smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "index.md"
      - "js/content.js"
      - "videos.html"
      - "videos.md"
      - "sitemap.xml"
      - "sitemap.md"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/nav_guard.py"
      - ".github/workflows/pages-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate public navigation and video discovery
        run: python scripts/nav_guard.py
