name: Pages route smoke test

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview_key:
        description: "Optional published preview key, e.g. pr-3028"
        required: false
        type: string

permissions:
  contents: read

jobs:
  route-smoke:
    name: Verify published routes return HTTP 200
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check canonical routes and every primary Tribute destination
        env:
          PREVIEW_KEY: ${{ inputs.preview_key || '' }}
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://timerloggedout-spec.github.io/"
            "https://timerloggedout-spec.github.io/tribute/"
            "https://timerloggedout-spec.github.io/help-wanted/"
            "https://timerloggedout-spec.github.io/matrix/"
            "https://timerloggedout-spec.github.io/termux-monorepo/"
            "https://timerloggedout-spec.github.io/studysprint/"
            "https://timerloggedout-spec.github.io/delphi-oracle/"
            "https://timerloggedout-spec.github.io/repo-story/"
            "https://timerloggedout-spec.github.io/sitemap.xml"
            "https://timerloggedout-spec.github.io/robots.txt"
            "https://timerloggedout-spec.github.io/tribute/sitemap.xml"
            "https://timerloggedout-spec.github.io/tribute/robots.txt"
            "https://timerloggedout-spec.github.io/tribute/3l0.html"
            "https://timerloggedout-spec.github.io/tribute/admin.html"
            "https://timerloggedout-spec.github.io/tribute/admin-graph.html"
            "https://timerloggedout-spec.github.io/tribute/ates.html"
            "https://timerloggedout-spec.github.io/tribute/countdowns.html"
            "https://timerloggedout-spec.github.io/tribute/delphi-ledger.html"
            "https://timerloggedout-spec.github.io/tribute/delphi-rfp.html"
            "https://timerloggedout-spec.github.io/tribute/desk.html"
            "https://timerloggedout-spec.github.io/tribute/dispatch-tree.html"
            "https://timerloggedout-spec.github.io/tribute/doe.html"
            "https://timerloggedout-spec.github.io/tribute/free-tier-value.html"
            "https://timerloggedout-spec.github.io/tribute/linguist.html"
            "https://timerloggedout-spec.github.io/tribute/matrix.html"
            "https://timerloggedout-spec.github.io/tribute/moneyball.html"
            "https://timerloggedout-spec.github.io/tribute/mvt.html"
            "https://timerloggedout-spec.github.io/tribute/oracle.html"
            "https://timerloggedout-spec.github.io/tribute/pr-lanes.html"
            "https://timerloggedout-spec.github.io/tribute/proposals.html"
            "https://timerloggedout-spec.github.io/tribute/quota-graphs.html"
            "https://timerloggedout-spec.github.io/tribute/quota-usage.html"
            "https://timerloggedout-spec.github.io/tribute/quota.html"
            "https://timerloggedout-spec.github.io/tribute/telemetry.html"
            "https://timerloggedout-spec.github.io/tribute/tracking.html"
            "https://timerloggedout-spec.github.io/tribute/versioning.html"
          )
          if [ -n "$PREVIEW_KEY" ]; then
            if ! [[ "$PREVIEW_KEY" =~ ^[a-z0-9][a-z0-9-]{0,60}$ ]]; then
              echo "::error::preview_key must be lowercase letters, digits, and hyphens."
              exit 1
            fi
            urls+=(
              "https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/"
              "https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/tracking.html"
              "https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/versioning.html"
              "https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/sitemap.xml"
              "https://timerloggedout-spec.github.io/previews/$PREVIEW_KEY/tribute/robots.txt"
            )
          fi
          failed=0
          for url in "${urls[@]}"; do
            code=$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error title=Published route failed::$code $url"
              failed=1
            else
              echo "OK $url"
            fi
          done
          test "$failed" -eq 0
