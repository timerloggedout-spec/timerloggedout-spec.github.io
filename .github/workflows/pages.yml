name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate required public surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s videos.html
          test -s videos.md
          test -s sitemap.xml
          test -s llms.txt
          test -s llms-full.txt
          grep -q 'i0FusuYuRUs' index.html
          grep -q 'i0FusuYuRUs' videos.html
          grep -q 'videos.html' llms.txt
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          print("Public surface and XML sitemap validation passed.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy public site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
